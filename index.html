<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night ’26 Shell — Shop the Look</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
@property --tone{syntax:'<color>';inherits:false;initial-value:transparent}
:root{--bg:#0d0e10;--panel:#121316;--card:#1b1d21;--card-2:#24272c;--ink:#f2f3f5;--mute:#8a8e96;--dim:#5b5f67;--line:rgba(255,255,255,.08);--blue:#1f4dff;--blue-2:#3d64ff;--sw:clamp(300px,31vw,500px);--mh:500px;--mw:331px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) var(--sw)}
#runway{position:relative;height:100%;overflow:hidden;background:radial-gradient(60% 46% at 50% 44%,rgba(70,78,96,.32),transparent 70%),linear-gradient(180deg,#131418 0%,#101114 56%,#0a0b0d 74%,#0b0c0e 100%)}
#runway::after{content:"";position:absolute;left:0;right:0;top:66%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
#floorGlow{position:absolute;left:52%;top:69%;width:70%;height:24%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,var(--tone),transparent);transition:--tone .9s}
.title{position:absolute;left:clamp(20px,4.4%,48px);top:clamp(22px,4.2vh,38px);max-width:46%;z-index:25;pointer-events:none}
.title h1{font-weight:400;font-size:clamp(26px,3.6vw,40px);letter-spacing:-.025em;line-height:1}
.title p{font-size:13px;color:var(--mute);margin-top:12px}
#models{position:absolute;inset:0;z-index:1;touch-action:pan-y}
.model{position:absolute;left:0;top:0;width:var(--mw);height:var(--mh);margin-left:calc(var(--mw)/-2);transform-origin:50% 100%;pointer-events:none;will-change:transform,filter,opacity}
.fig{position:absolute;inset:0;background:center bottom/contain no-repeat;-webkit-box-reflect:below -2px linear-gradient(transparent 68%,rgba(255,255,255,.22))}
.hit{position:absolute;left:29%;right:29%;top:3%;bottom:2%;pointer-events:auto;cursor:none}
.model.c .hit{cursor:default}
#pins{position:absolute;inset:0;z-index:22;pointer-events:none}
.pin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid #fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.pin.on{transform:scale(1)}
.pin::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff}
.pin::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,255,255,.7);animation:ring 2.2s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.7);opacity:0}}
.tip{position:absolute;left:34px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;padding:8px 12px;border-radius:10px;background:rgba(20,22,26,.85);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .2s;text-align:left}
.tip u{text-decoration:none;color:var(--mute);margin-left:6px}
.pin.tipon .tip,.pin:hover .tip{opacity:1}
#view{position:fixed;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;color:#0d0e10;display:grid;place-items:center;font-size:8px;font-weight:600;letter-spacing:.18em;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none;z-index:999}
#view.on{transform:scale(1)}
#ctrl{position:absolute;left:clamp(16px,4.4%,48px);right:clamp(16px,4.4%,48px);bottom:clamp(14px,2.8vh,24px);height:40px;display:flex;align-items:center;gap:clamp(12px,2.5%,28px);z-index:20}
.ar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .15s}
.ar svg{width:22px;height:22px;stroke-width:1.4}
.ar:hover,.ib:hover{background:rgba(255,255,255,.08)}.ar:active{transform:scale(.92)}
#tl{display:flex;gap:6px;max-width:520px}
.seg{width:52px;flex:none;text-align:left;font-size:10px;font-variant-numeric:tabular-nums;color:var(--mute);transition:width .6s cubic-bezier(.7,0,.2,1);white-space:nowrap;overflow:hidden;padding:8px 0}
.seg .tr{display:block;height:2px;background:rgba(255,255,255,.18);margin-bottom:8px}
.seg i{display:block;height:100%;width:0;background:#fff}
.seg b{font-weight:400}.seg em{font-style:normal;margin-left:6px;opacity:0;transition:opacity .4s;color:#fff;font-weight:500}
.seg.a{width:150px;color:#fff}.seg.a em{opacity:1}
#pp{width:36px;height:36px;margin-left:auto;border-radius:50%;display:grid;place-items:center}
#pp svg{width:16px;height:16px;fill:currentColor;stroke:none}
#pill{position:fixed;left:calc((100vw - var(--sw))/2);transform:translateX(-50%);top:clamp(14px,2.4vh,22px);height:46px;border-radius:24px;padding:0 8px;display:flex;align-items:center;background:rgba(28,30,35,.78);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px -12px rgba(0,0,0,.7);z-index:100}
.ib{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.ib svg{width:18px;height:18px;stroke:#fff}
.ib.logo{width:56px;border-radius:19px}.ib.logo svg{width:40px;height:20px;fill:#fff;stroke:none}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.badge{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--blue);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.badge.on{transform:scale(1)}.badge.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.5)}}
#side{background:var(--panel);border-left:1px solid var(--line);padding:clamp(20px,3.3vh,30px) clamp(16px,1.9vw,28px) clamp(18px,3vh,28px);display:flex;flex-direction:column;overflow:auto;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.hd h2{font-size:20px;font-weight:400}.hd h2 span{color:var(--mute)}
.hd em{font-style:normal;font-size:10px;font-weight:500;letter-spacing:.14em;color:var(--mute)}
.cards{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.card{position:relative;height:clamp(104px,13.8vh,124px);border-radius:16px;background:var(--card);border:1px solid var(--line);padding:12px;display:flex;gap:18px;transition:border-color .2s,background .2s}
.card.hl{border-color:rgba(61,100,255,.8);background:#1d2130}
.thumb,.info,.plus{transition:opacity .35s,filter .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.thumb{position:relative;height:100%;aspect-ratio:4/5;border-radius:10px;background:var(--card-2) no-repeat;flex:none}
.thumb s{position:absolute;top:5px;right:7px;font-size:9px;text-decoration:none;color:var(--mute)}
.info{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.nm{font-size:14px}.pr{font-size:13px;color:var(--mute)}
.plus{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;transition:background .25s,opacity .35s,filter .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.plus svg{width:16px;height:16px;transition:transform .3s}.plus.on{background:var(--blue)}.plus.on svg{transform:rotate(45deg)}
.card.out .thumb,.card.out .info,.card.out .plus{opacity:0;filter:blur(6px);transform:translateY(6px)}
.sk{position:absolute;inset:12px;display:flex;gap:18px;opacity:0;pointer-events:none;transition:opacity .35s}
.card.out .sk{opacity:1}
.sk .col{display:flex;flex-direction:column;gap:10px;padding-top:6px;flex:1}
.sk i{display:block;border-radius:8px;background:linear-gradient(90deg,#202328,#2a2e34,#202328) 0 0/200% 100%;animation:sh 1.1s linear infinite}
.sk .b1{height:100%;aspect-ratio:4/5;border-radius:10px}.sk .b2{height:14px;width:60%}.sk .b3{height:12px;width:30%}
.sk .b4{position:absolute;right:0;bottom:0;width:32px;height:32px;border-radius:50%}
@keyframes sh{to{background-position:-200% 0}}
.bundle{margin-top:auto;padding-top:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bundle b{display:block;font-size:13px;font-weight:500}.bundle small{display:block;font-size:11px;color:var(--mute);margin-top:4px}
.bundle .r{text-align:right}.bundle s{display:block;font-size:11px;color:var(--dim)}.bundle strong{font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.cta{position:relative;overflow:hidden;margin-top:16px;width:100%;height:54px;border-radius:28px;background:var(--blue);display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.08em;color:#fff;transition:background .2s,transform .15s}
.cta:hover{background:var(--blue-2)}.cta:active{transform:scale(.985)}
.cta svg{width:22px;height:22px;transition:transform .25s}.cta:hover svg{transform:translateX(4px)}
.cta i{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left;pointer-events:none}
.cta i.go{animation:sw .7s ease-out}
@keyframes sw{0%{transform:scaleX(0);opacity:.9}100%{transform:scaleX(1);opacity:0}}
.fly{position:fixed;left:0;top:0;transform-origin:0 0;border-radius:10px;z-index:900;pointer-events:none;transition:transform .75s cubic-bezier(.6,0,.2,1),opacity .75s}
#toast{position:fixed;left:calc((100vw - var(--sw))/2);transform:translate(-50%,-10px);top:clamp(70px,9vh,84px);padding:10px 16px;border-radius:20px;background:rgba(28,30,35,.92);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:300;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.seg{width:30px}.seg.a{width:120px}}
@media(max-width:820px){
:root{--sw:100vw}
html,body{height:auto;overflow:auto}
#stage{position:static;display:block}
#runway{height:min(86svh,760px)}
#side{border-left:0;border-top:1px solid var(--line);overflow:visible}
.title{top:78px}
#pill{position:absolute;left:50%}
#toast{left:50%;position:fixed}
.seg{width:22px}.seg.a{width:44px}.seg em{display:none}
#view{display:none}
}
#ov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.55);display:flex;justify-content:flex-end}
#ov[hidden]{display:none}
.sheet{width:min(420px,100vw);height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}
.sheet h3{font-size:16px;font-weight:500}
#pbody{padding:20px;overflow:auto;flex:1;user-select:text;-webkit-user-select:text}
.hint{font-size:13px;color:var(--mute);line-height:1.5;margin-bottom:16px}
.grp{margin-bottom:20px}.grp h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:500;margin-bottom:8px}
.grp label{display:block;margin-bottom:10px;font-size:13px}.grp label span{display:block;margin-bottom:4px}
.grp input{width:100%;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:0 12px;font:inherit;font-size:13px;outline:0}
.grp input:focus{border-color:var(--blue-2)}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.rt{width:48px;height:60px;border-radius:8px;flex:none}
.ri{flex:1;min-width:0;font-size:13px}.ri small{color:var(--mute);font-size:12px}
.buy{height:36px;padding:0 14px;border-radius:18px;background:#ee4d2d;color:#fff;font-size:12px;font-weight:600}
.rm{width:28px;height:28px;color:var(--mute)}
</style></head>
<body>
<div id="stage">
<div id="runway">
<div id="floorGlow"></div>
<div class="title"><h1>Night ’26 Shell</h1><p>Six looks, styled head to toe. Tap a pin to see the piece.</p></div>
<div id="models"></div><div id="pins"></div>
<div id="ctrl">
<button class="ar" id="prev" aria-label="Previous look"><svg viewBox="0 0 24 24"><path d="M21 12H4M10 6l-6 6 6 6"/></svg></button>
<div id="tl"></div>
<button id="pp" aria-label="Pause"></button>
<button class="ar" id="next" aria-label="Next look"><svg viewBox="0 0 24 24"><path d="M3 12h17M14 6l6 6-6 6"/></svg></button>
</div>
</div>
<aside id="side">
<div class="hd"><h2>In this <span>look</span></h2><em>2 PIECES</em></div>
<div class="cards" id="cards"></div>
<div class="bundle"><div><b>Complete the look</b><small>Bundle all 2 and save 10%</small></div><div class="r"><s id="old"></s><strong id="bun"></strong></div></div>
<button class="cta" id="cta"><span id="ctaL">ADD FULL LOOK TO BAG</span><svg viewBox="0 0 24 24"><path d="M3 12h17M14 6l6 6-6 6"/></svg><i></i></button>
</aside>
</div>
<nav id="pill">
<button class="ib" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16"/></svg></button><span class="sep"></span>
<button class="ib logo" aria-label="Logo"><svg viewBox="0 0 40 20"><path d="M2 13C9 12 17 8 24 4c4-2 9-3 14-3-8 3-15 7-21 12-4 3-8 5-12 5-2 0-3-3-3-5z"/></svg></button><span class="sep"></span>
<button class="ib" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg></button>
<button class="ib" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
<button class="ib" id="bagBtn" aria-label="Bag"><svg viewBox="0 0 24 24"><path d="M5 8h14l1 12H4L5 8zM9 8V7a3 3 0 0 1 6 0v1"/></svg><span class="badge" id="badge">0</span></button>
</nav>
<div id="ov" hidden><div class="sheet"><header><h3 id="ptitle"></h3><button class="ar" id="px" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div id="pbody"></div></div></div>
<div id="view">VIEW</div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),CDN='https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/';
const H=(f,w)=>'https://images.higgs.ai/?default=1&output=webp&url='+encodeURIComponent(CDN+f)+'&w='+w+'&q=85';
const L=[
{n:'Cobalt Shell',f:'hf_20261113_092602_2edcdd38-47f9-40ca-b2f0-3d1196e356ed.png',t:'rgba(40,80,255,.30)',p:[['Cobalt Rain Shell',425,300,1080,.60,.30],['Wide Cargo Pant',165,1020,2010,.38,.70]]},
{n:'Silver Signal',f:'hf_20261113_092602_489603db-d621-4dac-8dad-0aaf42f0d15c.png',t:'rgba(200,210,230,.24)',p:[['Mirror Down Parka',650,230,1100,.62,.30],['Straight Tech Trouser',180,1040,2010,.38,.72]]},
{n:'Night Run',f:'hf_20261113_092516_b5bd2ecc-b375-46e1-bb83-eca3e17f818b.png',t:'rgba(70,78,96,.32)',p:[['Storm Hooded Shell',390,230,1040,.62,.30],['Wide Cargo Pant',165,1000,2010,.38,.70]]},
{n:'Long Hour',f:'hf_20261113_092601_1b201cc2-e88d-4501-80a3-6907b149777a.png',t:'rgba(80,86,100,.30)',p:[['Hooded Long Parka',720,260,1440,.62,.36],['Straight Tech Trouser',180,1360,2010,.40,.82]]},
{n:'Gallery Opening',f:'hf_20261113_092603_fceeb6f1-9ee2-4883-8e0f-3327ae0bab7a.png',t:'rgba(90,96,110,.30)',p:[['Quilted Down Vest',310,240,1110,.58,.30],['Graphite Cargo Pant',175,1060,2010,.38,.70]]},
{n:'Soft Static',f:'hf_20261113_092602_91acecdf-be55-4f27-b413-012a4615763a.png',t:'rgba(110,112,120,.26)',p:[['Graphite Fleece Half-Zip',210,320,1000,.60,.28],['Pleated Wide Trouser',195,940,2010,.40,.70]]}];
const runway=$('#runway'),modelsEl=$('#models'),pinsEl=$('#pins'),viewEl=$('#view'),cardsEl=$('#cards'),tlEl=$('#tl');
let pos=2,active=2,tween=null,drag=null,dragged=false,playing=true,ap=0,MH=500,MW=331,U=1,CX=0,FEET=0,px=-1,py=-1;
const bag=new Set(),ease=t=>1-Math.pow(1-t,4.2);
const wrap=d=>((d+3)%6+6)%6-3;
// models
const models=L.map((l,i)=>{const m=document.createElement('div');m.className='model';
m.innerHTML='<div class="fig"></div><div class="hit"></div>';m.firstChild.style.backgroundImage='url("'+H(l.f,900)+'")';
m.lastChild.addEventListener('click',()=>{if(!dragged&&i!==active)go(i)});modelsEl.append(m);
const im=new Image();im.src=H(l.f,900);im.decode&&im.decode().catch(()=>{});return m});

const segs=L.map((l,i)=>{const s=document.createElement('button');s.className='seg';

// cards

c.querySelector('.plus').onclick=()=>toggle(active,k,c.querySelector('.thumb'));
c.onmouseenter=()=>{const p=pinsEl.children[k];p&&p.classList.add('tipon')};
c.onmouseleave=()=>{const p=pinsEl.children[k];p&&p.classList.remove('tipon')};
cardsEl.append(c);return c});
let shownOld=0,shownBun=0,cnt=0;
function count(el,from,to,fn){const id=++cnt,t0=performance.now();
(function s(now){if(id!==cnt)return;const t=Math.min(1,(now-t0)/600),e=1-Math.pow(1-t,3);el.textContent=fn(from+(to-from)*e);if(t<1)requestAnimationFrame(s)})(t0)}
const money=v=>'$'+v.toFixed(2).replace(/\B(?=(\d{3})+\.)/g,',');
function thumbs(){cards.forEach((c,k)=>{const p=L[active].p[k],th=c.querySelector('.thumb'),h=th.clientHeight,w=th.clientWidth,y0=p[2],y1=p[3],kk=Math.min(h/(y1-y0),w/560);
th.style.backgroundImage='url("'+H(L[active].f,900)+'")';th.style.backgroundSize=(1360*kk)+'px '+(2048*kk)+'px';
th.style.backgroundPosition=(w/2-680*kk)+'px '+(-y0*kk+(h-(y1-y0)*kk)/2)+'px'})}
function fill(){cards.forEach((c,k)=>{const p=L[active].p[k];c.querySelector('.nm').textContent=p[0];c.querySelector('.pr').textContent=money(p[1])})
thumbs();const sum=L[active].p[0][1]+L[active].p[1][1],b=sum*.9;
count($('#old'),shownOld,sum,money);count($('#bun'),shownBun,b,money);shownOld=sum;shownBun=b;sync()}
function sync(){cards.forEach((c,k)=>c.querySelector('.plus').classList.toggle('on',bag.has(active+'-'+k)));
$('#ctaL').textContent=bag.has(active+'-0')&&bag.has(active+'-1')?'FULL LOOK IN BAG':'ADD FULL LOOK TO BAG'}
let tm=[];
function swap(){tm.forEach(clearTimeout);tm=[];cards.forEach(c=>c.classList.add('out'));
tm.push(setTimeout(()=>{fill();tm.push(setTimeout(()=>cards[0].classList.remove('out'),180),setTimeout(()=>cards[1].classList.remove('out'),320))},420))}
// bag
const badge=$('#badge');
function setBadge(){badge.textContent=bag.size;badge.classList.toggle('on',bag.size>0);badge.classList.remove('bump');void badge.offsetWidth;badge.classList.add('bump')}
let tt;function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1700)}
function fly(th){const r=th.getBoundingClientRect(),b=$('#bagBtn').getBoundingClientRect(),f=th.cloneNode(true);
f.className='fly';f.style.cssText+=';left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;background-color:#24272c';
document.body.append(f);requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform='translate('+(b.left+b.width/2-6-r.left)+'px,'+(b.top+b.height/2-6-r.top)+'px) scale('+12/r.width+','+12/r.height+')'}));
setTimeout(()=>f.remove(),800)}
function toggle(li,k,th){const key=li+'-'+k;
if(bag.has(key)){bag.delete(key);toast('Removed from bag');setBadge()}
else{bag.add(key);fly(th);toast(L[li].p[k][0]+' added');setTimeout(setBadge,700)}sync()}
$('#cta').onclick=()=>{const i=$('#cta i');i.classList.remove('go');void i.offsetWidth;i.classList.add('go');
const miss=[0,1].filter(k=>!bag.has(active+'-'+k));
if(!miss.length){toast('Full look already in your bag');return}
const li=active;miss.forEach((k,n)=>{bag.add(li+'-'+k);const th=cards[k].querySelector('.thumb');setTimeout(()=>fly(th),n*120);setTimeout(setBadge,700+n*120)});
toast(L[li].n+' — full look added · saved 10%');sync()};
// pins
function place(b){b.style.left=(CX-MW/2+b.dataset.x*MW)+'px';b.style.top=(FEET-MH+b.dataset.y*MH)+'px'}
function hidePins(){pinsEl.innerHTML=''}
function showPins(){hidePins();L[active].p.forEach((p,k)=>{const b=document.createElement('button');b.className='pin';b.dataset.x=p[4];b.dataset.y=p[5];
b.innerHTML='<span class="tip"><b style="font-weight:600">'+p[0]+'</b><u>$'+p[1]+'.00</u></span>';place(b);
b.onmouseenter=()=>cards[k].classList.add('hl');b.onmouseleave=()=>cards[k].classList.remove('hl');
b.onclick=e=>{e.stopPropagation();b.classList.toggle('tipon')};pinsEl.append(b);setTimeout(()=>b.classList.add('on'),120+k*120)})}
// geometry
function measure(){const W=runway.clientWidth,Hh=runway.clientHeight,n=innerWidth<=820;
MH=Math.min(Hh*(n?.66:.705),W*(n?1.05:.92));MW=MH*421/634;U=MH/634;CX=W*(n?.5:.523);FEET=Hh*(n?.86:.85);
const r=document.documentElement.style;r.setProperty('--mh',MH+'px');r.setProperty('--mw',MW+'px');
[...pinsEl.children].forEach(place);thumbs()}
new ResizeObserver(measure).observe(runway);addEventListener('resize',measure);
// depth
const T=[[0,0,1,0,0,1,1],[1,160,.94,12,1.2,.9,1],[2,284,.85,59,4,.72,1],[3,362,.78,95,8,.55,.55],[3.6,392,.74,110,11,.48,0]];
function dp(a){let k=0;while(k<T.length-2&&a>T[k+1][0])k++;const A=T[k],B=T[k+1],u=Math.min(1,(a-A[0])/(B[0]-A[0]));return A.map((v,j)=>v+(B[j]-v)*u)}
function render(){models.forEach((m,i)=>{const d=wrap(i-pos),a=Math.abs(d),r=dp(a),s=d<0?-1:1;
m.style.transform='translate3d('+(CX+s*r[1]*U)+'px,'+(FEET-r[3]*U-MH)+'px,0) scale('+r[2]+')';
m.style.filter='blur('+(r[4]*Math.max(.6,U))+'px) brightness('+r[5]+')';m.style.opacity=r[6];
m.style.zIndex=100-Math.round(a*10);m.classList.toggle('c',a<.5)})}
// go
function go(i,dir){i=((i%6)+6)%6;let d=wrap(i-pos);if(Math.abs(Math.abs(d)-3)<1e-6&&dir)d=3*dir;
tween={from:pos,to:pos+d,t0:performance.now(),dur:760+(Math.max(1,Math.abs(d))-1)*140};
const ch=i!==active;active=i;hidePins();viewEl.classList.remove('on');if(ch)swap();ap=0;
$('#floorGlow').style.setProperty('--tone',L[i].t);}
// cursor
document.addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;viewEl.style.left=px+'px';viewEl.style.top=py+'px'});
function cursorCheck(){let on=false;if(px>=0&&!tween&&!drag){const el=document.elementFromPoint(px,py);
on=!!(el&&el.classList.contains('hit')&&!el.parentNode.classList.contains('c'))}viewEl.classList.toggle('on',on)}
// drag
runway.addEventListener('pointerdown',e=>{if(e.target.closest('#ctrl,.pin')||e.button>0)return;dragged=false;drag={x:e.clientX,p:pos,on:false}});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;
if(!drag.on&&Math.abs(dx)>5){drag.on=true;dragged=true;tween=null;drag.p=pos;drag.x=e.clientX;hidePins();viewEl.classList.remove('on');return}
if(drag.on)pos=drag.p-(e.clientX-drag.x)/(170*U)});
function up(){if(!drag)return;const was=drag.on;drag=null;if(was)go(Math.round(pos));setTimeout(()=>dragged=false,0)}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
// controls
$('#prev').onclick=()=>go(active-1,-1);$('#next').onclick=()=>go(active+1,1);
addEventListener('keydown',e=>{if(e.target.closest('input,#ov'))return;if(e.key==='ArrowLeft')go(active-1,-1);else if(e.key==='ArrowRight')go(active+1,1);else if(e.key===' '){e.preventDefault();togglePlay()}});
const pp=$('#pp'),PAUSE='<svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>',PLAY='<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>';
pp.innerHTML=PAUSE;function togglePlay(){playing=!playing;pp.innerHTML=playing?PAUSE:PLAY;pp.setAttribute('aria-label',playing?'Pause':'Play')}pp.onclick=togglePlay;
// bag + shopee settings
const ov=$('#ov'),pbody=$('#pbody'),ptitle=$('#ptitle');
let links={};try{links=JSON.parse(localStorage.getItem('shopee')||'{}')}catch(e){}
const saveLinks=()=>{try{localStorage.setItem('shopee',JSON.stringify(links))}catch(e){}};
const okUrl=u=>/^https?:\/\//i.test(u||'');
function setView(){ptitle.textContent='Settings · Shopee links';pbody.innerHTML='<p class="hint">Paste the Shopee product link for each piece. “Buy on Shopee” in your bag opens that link.</p>';
L.forEach((l,i)=>{const g=document.createElement('div');g.className='grp';g.innerHTML='<h4>'+l.n+'</h4>';
l.p.forEach((p,k)=>{const key=i+'-'+k,lb=document.createElement('label');lb.innerHTML='<span>'+p[0]+'</span>';
const inp=document.createElement('input');inp.type='url';inp.placeholder='https://shopee.co.th/…';inp.value=links[key]||'';
inp.oninput=()=>{links[key]=inp.value.trim();saveLinks()};lb.append(inp);g.append(lb)});pbody.append(g)})}
function bagView(){ptitle.textContent='Your bag';pbody.innerHTML='';
if(!bag.size){pbody.innerHTML='<p class="hint">Your bag is empty.</p>';return}
[...bag].forEach(key=>{const[li,k]=key.split('-').map(Number),p=L[li].p[k],r=document.createElement('div');r.className='row';
const th=document.createElement('div');th.className='rt';const h=60,w=48,kk=Math.min(h/(p[3]-p[2]),w/560);
th.style.cssText='background:#24272c url("'+H(L[li].f,900)+'") no-repeat;background-size:'+1360*kk+'px '+2048*kk+'px;background-position:'+(w/2-680*kk)+'px '+(-p[2]*kk+(h-(p[3]-p[2])*kk)/2)+'px';
const inf=document.createElement('div');inf.className='ri';inf.innerHTML='<div>'+p[0]+'</div><small>'+money(p[1])+'</small>';
const buy=document.createElement('button');buy.className='buy';buy.textContent=okUrl(links[key])?'Buy on Shopee':'Add Shopee link';
buy.onclick=()=>okUrl(links[key])?window.open(links[key],'_blank','noopener'):setView();
const rm=document.createElement('button');rm.className='rm';rm.textContent='✕';rm.setAttribute('aria-label','Remove');
rm.onclick=()=>{bag.delete(key);setBadge();sync();bagView()};
r.append(th,inf,buy,rm);pbody.append(r)})}
function openPanel(v){ov.hidden=false;v==='bag'?bagView():setView()}
$('#bagBtn').onclick=()=>openPanel('bag');$('#setBtn').onclick=()=>openPanel('set');
$('#px').onclick=()=>ov.hidden=true;ov.addEventListener('click',e=>{if(e.target===ov)ov.hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape')ov.hidden=true});
// loop
let last=performance.now();
function frame(now){const dt=Math.min(100,now-last);last=now;
if(tween){const t=Math.min(1,(now-tween.t0)/tween.dur);pos=tween.from+(tween.to-tween.from)*ease(t);if(t>=1){pos=tween.to;tween=null;showPins()}}
if(playing&&!tween&&!drag){ap+=dt;if(ap>=5200)go(active+1,1)}
segs.forEach((s,i)=>{s.classList.toggle('a',i===active);s.querySelector('i').style.width=(i<active?100:i===active?Math.min(100,ap/52):0)+'%'});
render();cursorCheck();requestAnimationFrame(frame)}
measure();fill();$('#floorGlow').style.setProperty('--tone',L[active].t);showPins();requestAnimationFrame(frame);
</script>
</body></html>
